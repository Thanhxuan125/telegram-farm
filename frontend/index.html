<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Nông Trại Xanh - Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #087ee8;
    }

    body {
      overflow-x: hidden;
    }

    .game {
      position: relative;
      min-height: 100vh;
      width: 100%;
      overflow: hidden;

      background-image: url("./public/assets/background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .overlay {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title {
      margin-top: 10px;
      padding: 12px 24px;
      border-radius: 20px;

      color: white;
      background: rgba(0, 70, 160, 0.75);

      border: 2px solid rgba(255, 255, 255, 0.7);

      font-size: 26px;
      font-weight: bold;
      text-align: center;

      text-shadow: 2px 2px 3px #004080;
    }

    .character {
      width: min(75vw, 380px);
      max-height: 65vh;
      object-fit: contain;

      margin-top: 20px;

      filter: drop-shadow(0 10px 8px rgba(0, 0, 0, 0.3));
    }

    .status {
      margin-top: 10px;
      padding: 10px 20px;

      color: white;
      background: rgba(0, 80, 170, 0.8);

      border: 2px solid #6ed8ff;
      border-radius: 15px;

      font-size: 16px;
      text-align: center;
    }

    @media (max-width: 500px) {
      .title {
        font-size: 21px;
      }

      .character {
        width: 82vw;
      }
    }
  </style>
</head>

<body>

  <main class="game">

    <div class="overlay">

      <div class="title">
        🌱 NÔNG TRẠI XANH
      </div>

      <img
        class="character"
        src="./public/assets/hero.png"
        alt="Nhân vật nông dân"
      >

      <div class="status">
        ✅ TEST BACKGROUND + NHÂN VẬT THÀNH CÔNG
      </div>

    </div>

  </main>

</body>
</html>
