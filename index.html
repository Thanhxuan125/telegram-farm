<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Nông Trại Xanh</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       GAME
  ========================== -->

  <main class="game">

    <!-- =========================
         KHUNG THÔNG TIN TRÊN
    ========================== -->

    <section class="top-hud">

      <!-- LEVEL -->

      <div class="level-box">

        <div class="level-circle">
          <span id="levelValue">1</span>
        </div>

        <div class="level-info">

          <div class="level-title">
            Lv.<span id="levelNumber">1</span>
          </div>

          <div class="exp-bar">

            <div
              id="expFill"
              class="exp-fill"
            ></div>

          </div>

          <div
            id="expText"
            class="exp-text"
          >
            0 / 7000 EXP
          </div>

        </div>

      </div>


      <!-- COIN -->

      <div class="resource-box">

        <div class="resource-icon coin-icon">
          🪙
        </div>

        <div
          id="coinValue"
          class="resource-number"
        >
          1000
        </div>

      </div>


      <!-- PHÂN -->

      <div class="resource-box">

        <div class="resource-icon">
          🧪
        </div>

        <div
          id="fertilizerValue"
          class="resource-number"
        >
          3
        </div>

      </div>

    </section>


    <!-- =========================
         TIÊU ĐỀ
    ========================== -->

    <div class="game-title">

      <div class="title-leaf left">
        🌿
      </div>

      <div class="title-text">
        <div>Nông Trại</div>
        <strong>Xanh</strong>
      </div>

      <div class="title-leaf right">
        🌿
      </div>

    </div>


    <!-- =========================
         NHÂN VẬT
    ========================== -->

    <div class="hero-area">

      <img
        src="/assets/hero.png"
        class="hero"
        alt="Nhân vật"
      >

    </div>


    <!-- =========================
         KHU ĐẤT
    ========================== -->

    <section class="farm-area">

      <div class="farm-grid">

        <button
          class="plot"
          data-plot="1"
        >
          <span class="plot-number">1</span>
        </button>

        <button
          class="plot"
          data-plot="2"
        >
          <span class="plot-number">2</span>
        </button>

        <button
          class="plot"
          data-plot="3"
        >
          <span class="plot-number">3</span>
        </button>

        <button
          class="plot locked"
          data-plot="4"
        >
          <span class="lock">🔒</span>
          <span class="plot-number">4</span>
        </button>

        <button
          class="plot locked"
          data-plot="5"
        >
          <span class="lock">🔒</span>
          <span class="plot-number">5</span>
        </button>


        <button
          class="plot locked"
          data-plot="6"
        >
          <span class="lock">🔒</span>
          <span class="plot-number">6</span>
        </button>

        <button
          class="plot locked"
          data-plot="7"
        >
          <span class="lock">🔒</span>
          <span class="plot-number">7</span>
        </button>

        <button
          class="plot locked"
          data-plot="8"
        >
          <span class="lock">🔒</span>
          <span class="plot-number">8</span>
        </button>

        <button
          class="plot locked"
          data-plot="9"
        >
          <span class="lock">🔒</span>
          <span class="plot-number">9</span>
        </button>

        <button
          class="plot locked"
          data-plot="10"
        >
          <span class="lock">🔒</span>
          <span class="plot-number">10</span>
        </button>


        <button
          class="plot locked"
          data-plot="11"
        >
          <span class="lock">🔒</span>
          <span class="plot-number">11</span>
        </button>

        <button
          class="plot locked"
          data-plot="12"
        >
          <span class="lock">🔒</span>
          <span class="plot-number">12</span>
        </button>

        <button
          class="plot locked"
          data-plot="13"
        >
          <span class="lock">🔒</span>
          <span class="plot-number">13</span>
        </button>

        <button
          class="plot locked"
          data-plot="14"
        >
          <span class="lock">🔒</span>
          <span class="plot-number">14</span>
        </button>

        <button
          class="plot locked"
          data-plot="15"
        >
          <span class="lock">🔒</span>
          <span class="plot-number">15</span>
        </button>


        <button
          class="plot locked"
          data-plot="16"
        >
          <span class="lock">🔒</span>
          <span class="plot-number">16</span>
        </button>

        <button
          class="plot locked"
          data-plot="17"
        >
          <span class="lock">🔒</span>
          <span class="plot-number">17</span>
        </button>

        <button
          class="plot locked"
          data-plot="18"
        >
          <span class="lock">🔒</span>
          <span class="plot-number">18</span>
        </button>

        <button
          class="plot locked"
          data-plot="19"
        >
          <span class="lock">🔒</span>
          <span class="plot-number">19</span>
        </button>

        <button
          class="plot locked"
          data-plot="20"
        >
          <span class="lock">🔒</span>
          <span class="plot-number">20</span>
        </button>

      </div>

    </section>


    <!-- =========================
         MENU DƯỚI
    ========================== -->

    <nav class="bottom-menu">

      <button class="menu-item">

        <span class="menu-icon">
          👥
        </span>

        <span>
          Bạn bè
        </span>

      </button>


      <button
        class="menu-item"
        id="seedMenuButton"
      >

        <span class="menu-icon">
          🌱
        </span>

        <span>
          Hạt giống
        </span>

      </button>


      <button class="menu-item">

        <span class="menu-icon">
          🏪
        </span>

        <span>
          Shop
        </span>

      </button>


      <button class="menu-item">

        <span class="menu-icon">
          🎯
        </span>

        <span>
          Nhiệm vụ
        </span>

      </button>


      <button class="menu-item">

        <span class="menu-icon">
          👛
        </span>

        <span>
          Ví
        </span>

      </button>

    </nav>

  </main>


  <!-- =========================
       BẢNG CHỌN HẠT
  ========================== -->

  <div
    id="seedPanel"
    class="seed-panel"
    aria-hidden="true"
  >

    <div class="seed-window">

      <div class="seed-header">

        <div>
          🌱 Chọn hạt giống
        </div>

        <button
          id="seedClose"
          class="seed-close"
        >
          ×
        </button>

      </div>


      <div
        id="selectedPlot"
        class="selected-plot"
      >
        Đang chọn ô đất
      </div>


      <div class="seed-list">

        <button
          class="seed-item"
          data-seed="wheat"
        >
          🌾
          <span>Lúa mì</span>
          <small>10 🪙 · Lv.1</small>
        </button>


        <button
          class="seed-item"
          data-seed="corn"
        >
          🌽
          <span>Ngô</span>
          <small>20 🪙 · Lv.3</small>
        </button>


        <button
          class="seed-item"
          data-seed="radish"
        >
          🌱
          <span>Củ cải</span>
          <small>35 🪙 · Lv.7</small>
        </button>


        <button
          class="seed-item"
          data-seed="carrot"
        >
          🥕
          <span>Cà rốt</span>
          <small>50 🪙 · Lv.10</small>
        </button>


        <button
          class="seed-item"
          data-seed="beet"
        >
          🫜
          <span>Củ dền</span>
          <small>75 🪙 · Lv.13</small>
        </button>


        <button
          class="seed-item"
          data-seed="eggplant"
        >
          🍆
          <span>Cà tím</span>
          <small>100 🪙 · Lv.15</small>
        </button>


        <button
          class="seed-item"
          data-seed="chili"
        >
          🌶️
          <span>Ớt</span>
          <small>180 🪙 · Lv.17</small>
        </button>


        <button
          class="seed-item"
          data-seed="green_onion"
        >
          🌿
          <span>Hành lá</span>
          <small>250 🪙 · Lv.20</small>
        </button>


        <button
          class="seed-item"
          data-seed="cabbage"
        >
          🥬
          <span>Bắp cải</span>
          <small>500 🪙 · Lv.23</small>
        </button>


        <button
          class="seed-item"
          data-seed="pumpkin"
        >
          🎃
          <span>Bí đỏ</span>
          <small>1000 🪙 · Lv.25</small>
        </button>

      </div>

    </div>

  </div>


  <script src="script.js"></script>

</body>

</html>
