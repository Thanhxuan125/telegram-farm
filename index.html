<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Nông Trại Xanh</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="game">

    <!-- BACKGROUND -->
    <img
      class="background"
      src="/assets/background.png"
      alt=""
    >

    <!-- NHÂN VẬT -->
    <img
      class="hero"
      src="/assets/hero.png"
      alt="Nhân vật nông dân"
    >

    <!-- KHU NÔNG TRẠI -->
    <div class="farm-grid">

      <button class="plot">1</button>
      <button class="plot">2</button>
      <button class="plot">3</button>
      <button class="plot locked">4</button>
      <button class="plot locked">5</button>

      <button class="plot locked">6</button>
      <button class="plot locked">7</button>
      <button class="plot locked">8</button>
      <button class="plot locked">9</button>
      <button class="plot locked">10</button>

      <button class="plot locked">11</button>
      <button class="plot locked">12</button>
      <button class="plot locked">13</button>
      <button class="plot locked">14</button>
      <button class="plot locked">15</button>

      <button class="plot locked">16</button>
      <button class="plot locked">17</button>
      <button class="plot locked">18</button>
      <button class="plot locked">19</button>
      <button class="plot locked">20</button>

    </div>

  </div>

</body>

</html>
