<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Nông Trại Xanh</title>

  <style>
    /* =========================
       CÀI ĐẶT CHUNG
    ========================= */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      font-family: Arial, sans-serif;

      color: white;

      overflow-x: hidden;

      /* BACKGROUND */
      background-image: url("/assets/background.png");
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }


    /* =========================
       KHUNG GAME
    ========================= */

    .game {
      position: relative;

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      padding: 20px 12px;

      display: flex;
      flex-direction: column;
      align-items: center;

      background: rgba(0, 80, 180, 0.08);
    }


    /* =========================
       TIÊU ĐỀ
    ========================= */

    h1 {
      margin: 10px 0 0;

      font-size: clamp(24px, 7vw, 38px);

      text-align: center;

      text-shadow:
        2px 2px 4px rgba(0, 50, 100, 0.8);
    }


    /* =========================
       NHÂN VẬT
    ========================= */

    .hero {
      width: 150px;

      /* Không cho nhân vật vượt quá màn hình */
      max-width: 40vw;

      /* Không cho nhân vật quá cao */
      max-height: 38vh;

      height: auto;

      object-fit: contain;

      display: block;

      margin-top: 25px;

      filter:
        drop-shadow(0 6px 6px rgba(0, 0, 0, 0.35));
    }


    /* =========================
       NÚT KIỂM TRA
    ========================= */

    .test {
      display: inline-block;

      margin-top: 20px;

      padding: 10px 16px;

      border-radius: 14px;

      background: rgba(8, 127, 245, 0.95);

      font-size: 14px;
      font-weight: bold;

      text-align: center;

      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.25);
    }


    /* =========================
       ĐIỆN THOẠI NHỎ
    ========================= */

    @media (max-width: 380px) {

      .game {
        padding: 15px 10px;
      }

      h1 {
        font-size: 24px;
      }

      .hero {
        width: 120px;
        max-width: 35vw;
        max-height: 32vh;
        margin-top: 20px;
      }

      .test {
        font-size: 12px;
        padding: 9px 13px;
      }
    }


    /* =========================
       ĐIỆN THOẠI MÀN HÌNH DÀI
    ========================= */

    @media (min-width: 381px) and (max-width: 600px) {

      .hero {
        width: 140px;
        max-width: 38vw;
        max-height: 36vh;
      }
    }


    /* =========================
       MÀN HÌNH LỚN
    ========================= */

    @media (min-width: 601px) {

      .hero {
        width: 180px;
        max-width: 220px;
      }
    }

  </style>
</head>


<body>

  <main class="game">

    <h1>🌱 NÔNG TRẠI XANH</h1>

    <!-- NHÂN VẬT -->
    <img
      class="hero"
      src="/assets/hero.png"
      alt="Nhân vật nông dân"
    >

    <!-- DÒNG KIỂM TRA -->
    <p class="test">
      ✅ Background + nhân vật hoạt động
    </p>

  </main>

</body>
</html>
