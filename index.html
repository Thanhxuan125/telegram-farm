<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Nông Trại Xanh</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #78cfff;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
    }

    /* KHUNG GAME */
    .game {
  position: relative;

  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;

  overflow: hidden;

  background: #78cfff;
}

    /* ==========================
       BACKGROUND 1111 x 1024
       HIỂN THỊ ĐÚNG TỶ LỆ
    ========================== */

    .background {
  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  object-fit: fill;

  z-index: 0;
}

    /* ==========================
       NHÂN VẬT
    ========================== */

    .hero {
      position: absolute;

      width: 125px;
      height: auto;

      max-width: 30vw;

      left: 50%;

      /* vị trí nhân vật */
      top: 24%;

      transform: translateX(-50%);

      object-fit: contain;

      filter: drop-shadow(
        0 6px 5px rgba(0, 0, 0, 0.30)
      );
    }

    /* ==========================
       ĐIỆN THOẠI NHỎ
    ========================== */

    @media (max-width: 380px) {

      .hero {
        width: 105px;
        max-width: 29vw;
        top: 23%;
      }
    }

    /* ==========================
       ĐIỆN THOẠI BÌNH THƯỜNG
    ========================== */

    @media (min-width: 381px) and (max-width: 600px) {

      .hero {
        width: 125px;
        max-width: 30vw;
        top: 24%;
      }
    }

    /* ==========================
       MÀN HÌNH LỚN
    ========================== */

    @media (min-width: 601px) {

      .game {
        max-width: 700px;
        margin: 0 auto;
      }

      .hero {
        width: 160px;
        top: 24%;
      }
    }

  </style>
</head>

<body>

  <main class="game">

    <!-- BACKGROUND -->
    <img
      class="background"
      src="/assets/background.png"
      alt=""
    >

    <!-- NHÂN VẬT -->
    <img
      class="hero"
      src="/assets/hero.png"
      alt=""
    >

  </main>

</body>
</html>
