<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Nông Trại Xanh</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background-color: #78cfff;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* =========================
       KHUNG GAME
    ========================= */

    .game {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      overflow: hidden;
    }

    /* =========================
       BACKGROUND
       HIỂN THỊ TOÀN BỘ ẢNH
    ========================= */

    .background {
      display: block;

      width: 100%;
      height: auto;

      max-width: 100%;

      object-fit: contain;
    }

    /* =========================
       NHÂN VẬT
    ========================= */

    .hero {
      position: absolute;

      width: 125px;
      height: auto;

      max-width: 32vw;
      max-height: 30vh;

      object-fit: contain;

      left: 50%;
      top: 22%;

      transform: translateX(-50%);

      filter:
        drop-shadow(0 6px 5px rgba(0, 0, 0, 0.3));
    }

    /* =========================
       ĐIỆN THOẠI NHỎ
    ========================= */

    @media (max-width: 380px) {

      .hero {
        width: 105px;
        max-width: 30vw;
        top: 20%;
      }
    }

    /* =========================
       ĐIỆN THOẠI BÌNH THƯỜNG
    ========================= */

    @media (min-width: 381px) and (max-width: 600px) {

      .hero {
        width: 125px;
        max-width: 32vw;
        top: 22%;
      }
    }

    /* =========================
       MÁY TÍNH / MÀN HÌNH LỚN
    ========================= */

    @media (min-width: 601px) {

      .game {
        max-width: 600px;
        margin: 0 auto;
      }

      .hero {
        width: 160px;
        top: 22%;
      }
    }

  </style>
</head>

<body>

  <main class="game">

    <!-- BACKGROUND -->
    <img
      class="background"
      src="/assets/background.png"
      alt=""
    >

    <!-- NHÂN VẬT -->
    <img
      class="hero"
      src="/assets/hero.png"
      alt="Nhân vật"
    >

  </main>

</body>
</html>
