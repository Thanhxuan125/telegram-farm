<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nông Trại Xanh</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: url("/assets/background.png") center / cover fixed;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }

    .game {
      min-height: 100vh;
      padding: 30px 15px;
      background: rgba(0, 80, 180, 0.18);
    }

    .hero {
      width: 220px;
      max-width: 70%;
      margin-top: 50px;
    }

    h1 {
      font-size: 28px;
      text-shadow: 2px 2px 4px #003b80;
    }

    .test {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 15px;
      background: #087ff5;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="game">

    <img
      class="hero"
      src="/assets/hero.png"
      alt="Nhân vật nông dân"
    >

    <h1>🌱 Nông Trại Xanh</h1>

    <div class="test">
      ✅ Background + nhân vật hoạt động
    </div>

  </main>
</body>
</html>
