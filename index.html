<!-- =========================
     BẢNG CHỌN HẠT GIỐNG
========================= -->

<div class="seed-panel" id="seedPanel">

  <div class="seed-box">

    <button
      class="seed-close"
      id="seedClose"
      type="button"
    >
      ×
    </button>

    <h2>🌱 Chọn hạt giống</h2>

    <div class="seed-list">

      <button class="seed-item" type="button">
        <span class="seed-icon">🌾</span>

        <span class="seed-info">
          <strong>Lúa mì</strong>
          <small>10 coin</small>
        </span>
      </button>


      <button class="seed-item" type="button">
        <span class="seed-icon">🌽</span>

        <span class="seed-info">
          <strong>Ngô</strong>
          <small>20 coin</small>
        </span>
      </button>


      <button class="seed-item" type="button">
        <span class="seed-icon">🌱</span>

        <span class="seed-info">
          <strong>Củ cải</strong>
          <small>35 coin</small>
        </span>
      </button>


      <button class="seed-item" type="button">
        <span class="seed-icon">🥕</span>

        <span class="seed-info">
          <strong>Cà rốt</strong>
          <small>50 coin</small>
        </span>
      </button>

    </div>

  </div>

</div>
