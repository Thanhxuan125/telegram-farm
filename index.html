<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nông Trại Xanh</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      background-image: url("/assets/background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
    }

    .game {
      min-height: 100vh;
      padding: 30px 15px;
      background: rgba(0, 80, 180, 0.15);
    }

    h1 {
      text-shadow: 2px 2px 4px #003b80;
    }

    .hero {
      display: block;
      width: 220px;
      max-width: 70%;
      margin: 50px auto 30px;

      filter: drop-shadow(
        0 8px 8px rgba(0, 0, 0, 0.3)
      );
    }

    .test {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 15px;
      background: #087ff5;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="game">

    <h1>🌱 NÔNG TRẠI XANH</h1>

    <img
      class="hero"
      src="/assets/hero.png"
      alt="Nhân vật nông dân"
    >

  </main>

</body>
</html>
