<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#69b9d8">

  <title>Nông Trại Xanh</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <main class="game">

    <!-- =========================
         BACKGROUND
    ========================== -->

    <img
      class="background"
      src="/assets/background.png"
      alt=""
    >


    <!-- =========================
         NHÂN VẬT
    ========================== -->

    <img
      class="hero"
      src="/assets/hero.png"
      alt="Nhân vật nông dân"
    >

    <!-- HUD NGƯỜI CHƠI -->
<section class="player-hud">

  <div class="hud-level">
    <div class="level-badge">1</div>

    <div class="level-info">
      <strong>Lv.1</strong>

      <div class="exp-bar">
        <div class="exp-fill"></div>
      </div>

      <small>0 / 7000 EXP</small>
    </div>
  </div>

  <div class="hud-resources">

    <div class="resource">
      <span>🪙</span>
      <strong id="coinValue">1000</strong>
    </div>

    <div class="resource">
      <span>🧪</span>
      <strong id="fertilizerValue">0</strong>
    </div>

  </div>

</section>

    <!-- =========================
         KHU 20 Ô ĐẤT
    ========================== -->

    <section
      class="farm-grid"
      aria-label="Nông trại"
    >

      <button class="plot unlocked" data-plot="1">
        <span class="plot-number">1</span>
      </button>

      <button class="plot unlocked" data-plot="2">
        <span class="plot-number">2</span>
      </button>

      <button class="plot unlocked" data-plot="3">
        <span class="plot-number">3</span>
      </button>


      <button class="plot locked" data-plot="4">
        <span class="lock">🔒</span>
      </button>

      <button class="plot locked" data-plot="5">
        <span class="lock">🔒</span>
      </button>

      <button class="plot locked" data-plot="6">
        <span class="lock">🔒</span>
      </button>

      <button class="plot locked" data-plot="7">
        <span class="lock">🔒</span>
      </button>

      <button class="plot locked" data-plot="8">
        <span class="lock">🔒</span>
      </button>

      <button class="plot locked" data-plot="9">
        <span class="lock">🔒</span>
      </button>

      <button class="plot locked" data-plot="10">
        <span class="lock">🔒</span>
      </button>

      <button class="plot locked" data-plot="11">
        <span class="lock">🔒</span>
      </button>

      <button class="plot locked" data-plot="12">
        <span class="lock">🔒</span>
      </button>

      <button class="plot locked" data-plot="13">
        <span class="lock">🔒</span>
      </button>

      <button class="plot locked" data-plot="14">
        <span class="lock">🔒</span>
      </button>

      <button class="plot locked" data-plot="15">
        <span class="lock">🔒</span>
      </button>

      <button class="plot locked" data-plot="16">
        <span class="lock">🔒</span>
      </button>

      <button class="plot locked" data-plot="17">
        <span class="lock">🔒</span>
      </button>

      <button class="plot locked" data-plot="18">
        <span class="lock">🔒</span>
      </button>

      <button class="plot locked" data-plot="19">
        <span class="lock">🔒</span>
      </button>

      <button class="plot locked" data-plot="20">
        <span class="lock">🔒</span>
      </button>

    </section>


    <!-- =========================
         BẢNG CHỌN HẠT GIỐNG
    ========================== -->

    <div
      class="seed-panel"
      id="seedPanel"
      aria-hidden="true"
    >

      <div class="seed-box">

        <button
          class="seed-close"
          id="seedClose"
          type="button"
          aria-label="Đóng"
        >
          ×
        </button>


        <h2>🌱 Chọn hạt giống</h2>

        <p
          class="selected-plot"
          id="selectedPlot"
        >
          Chọn ô đất
        </p>


        <div class="seed-list">


          <!-- LÚA MÌ -->

          <button
            class="seed-item"
            type="button"
            data-seed="wheat"
          >

            <span class="seed-icon">🌾</span>

            <span class="seed-info">
              <strong>Lúa mì</strong>
              <small>10 coin • Lv.1 • 20 phút</small>
            </span>

          </button>


          <!-- NGÔ -->

          <button
            class="seed-item"
            type="button"
            data-seed="corn"
          >

            <span class="seed-icon">🌽</span>

            <span class="seed-info">
              <strong>Ngô</strong>
              <small>20 coin • Lv.3 • 60 phút</small>
            </span>

          </button>


          <!-- CỦ CẢI -->

          <button
            class="seed-item"
            type="button"
            data-seed="radish"
          >

            <span class="seed-icon">🌱</span>

            <span class="seed-info">
              <strong>Củ cải</strong>
              <small>35 coin • Lv.7 • 90 phút</small>
            </span>

          </button>


          <!-- CÀ RỐT -->

          <button
            class="seed-item"
            type="button"
            data-seed="carrot"
          >

            <span class="seed-icon">🥕</span>

            <span class="seed-info">
              <strong>Cà rốt</strong>
              <small>50 coin • Lv.10 • 150 phút</small>
            </span>

          </button>


          <!-- CỦ DỀN -->

          <button
            class="seed-item"
            type="button"
            data-seed="beet"
          >

            <span class="seed-icon">🫜</span>

            <span class="seed-info">
              <strong>Củ dền</strong>
              <small>75 coin • Lv.13 • 280 phút</small>
            </span>

          </button>


          <!-- CÀ TÍM -->

          <button
            class="seed-item"
            type="button"
            data-seed="eggplant"
          >

            <span class="seed-icon">🍆</span>

            <span class="seed-info">
              <strong>Cà tím</strong>
              <small>100 coin • Lv.15 • 450 phút</small>
            </span>

          </button>


          <!-- ỚT -->

          <button
            class="seed-item"
            type="button"
            data-seed="chili"
          >

            <span class="seed-icon">🌶️</span>

            <span class="seed-info">
              <strong>Ớt</strong>
              <small>180 coin • Lv.17 • 650 phút</small>
            </span>

          </button>


          <!-- HÀNH LÁ -->

          <button
            class="seed-item"
            type="button"
            data-seed="green_onion"
          >

            <span class="seed-icon">🌿</span>

            <span class="seed-info">
              <strong>Hành lá</strong>
              <small>250 coin • Lv.20 • 870 phút</small>
            </span>

          </button>


          <!-- BẮP CẢI -->

          <button
            class="seed-item"
            type="button"
            data-seed="cabbage"
          >

            <span class="seed-icon">🥬</span>

            <span class="seed-info">
              <strong>Bắp cải</strong>
              <small>500 coin • Lv.23 • 950 phút</small>
            </span>

          </button>


          <!-- BÍ ĐỎ -->

          <button
            class="seed-item"
            type="button"
            data-seed="pumpkin"
          >

            <span class="seed-icon">🎃</span>

            <span class="seed-info">
              <strong>Bí đỏ</strong>
              <small>1000 coin • Lv.25 • 1200 phút</small>
            </span>

          </button>

        </div>

      </div>

    </div>

  </main>


  <!-- JAVASCRIPT -->

  <script src="/script.js"></script>

</body>

</html>
