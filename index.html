<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nông Trại Xanh</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: url("/assets/background.png") center / cover no-repeat fixed;
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
    }

    .game {
      min-height: 100vh;
      padding: 30px 15px;
      background: rgba(0, 80, 180, 0.15);
    }

    .hero {
      width: 220px;
      max-width: 70%;
      margin-top: 50px;
      filter: drop-shadow(0 8px 8px rgba(0,0,0,.3));
    }

    h1 {
      text-shadow: 2px 2px 4px #003b80;
    }

    .test {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 15px;
      background: #087ff5;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="game">

    <h1>🌱 NÔNG TRẠI XANH</h1>

    <img
      class="hero"
      background-image: url("/assets/background.png");
      alt="Nhân vật nông dân"
    >

    <p class="test">
      ✅ Background + nhân vật hoạt động
    </p>

  </main>
</body>
</html>
