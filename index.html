<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#55b9df"
  >

  <title>Nông Trại Xanh</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>


<body>

  <main class="game">

    <!-- =====================
         BACKGROUND
    ====================== -->

    <img
      class="background"
      src="/assets/background.png"
      alt=""
    >


    <!-- =====================
         NHÂN VẬT
    ====================== -->

    <img
      class="hero"
      src="/assets/hero.png"
      alt="Nhân vật nông dân"
    >


    <!-- =====================
         HUD
    ====================== -->

    <section class="player-hud">

      <div class="hud-level">

        <div class="level-badge">
          1
        </div>

        <div class="level-info">

          <strong>
            Lv.1
          </strong>

          <div class="exp-bar">

            <div
              class="exp-fill"
              id="expFill"
            ></div>

          </div>

          <small id="expText">
            0 / 7000 EXP
          </small>

        </div>

      </div>


      <div class="hud-resources">

        <div class="resource">

          <span>🪙</span>

          <strong id="coinValue">
            1000
          </strong>

        </div>


        <div class="resource">

          <span>🧪</span>

          <strong id="fertilizerValue">
            0
          </strong>

        </div>

      </div>

    </section>


    <!-- =====================
         20 Ô ĐẤT
    ====================== -->

    <section
      class="farm-grid"
      aria-label="Nông trại"
    >

      <button
        class="plot unlocked"
        data-plot="1"
      >
        <span class="plot-number">1</span>
      </button>


      <button
        class="plot unlocked"
        data-plot="2"
      >
        <span class="plot-number">2</span>
      </button>


      <button
        class="plot unlocked"
        data-plot="3"
      >
        <span class="plot-number">3</span>
      </button>


      <button
        class="plot locked"
        data-plot="4"
      >
        <span class="lock">🔒</span>
      </button>


      <button
        class="plot locked"
        data-plot="5"
      >
        <span class="lock">🔒</span>
      </button>


      <button
        class="plot locked"
        data-plot="6"
      >
        <span class="lock">🔒</span>
      </button>


      <button
        class="plot locked"
        data-plot="7"
      >
        <span class="lock">🔒</span>
      </button>


      <button
        class="plot locked"
        data-plot="8"
      >
        <span class="lock">🔒</span>
      </button>


      <button
        class="plot locked"
        data-plot="9"
      >
        <span class="lock">🔒</span>
      </button>


      <button
        class="plot locked"
        data-plot="10"
      >
        <span class="lock">🔒</span>
      </button>


      <button
        class="plot locked"
        data-plot="11"
      >
        <span class="lock">🔒</span>
      </button>


      <button
        class="plot locked"
        data-plot="12"
      >
        <span class="lock">🔒</span>
      </button>


      <button
        class="plot locked"
        data-plot="13"
      >
        <span class="lock">🔒</span>
      </button>


      <button
        class="plot locked"
        data-plot="14"
      >
        <span class="lock">🔒</span>
      </button>


      <button
        class="plot locked"
        data-plot="15"
      >
        <span class="lock">🔒</span>
      </button>


      <button
        class="plot locked"
        data-plot="16"
      >
        <span class="lock">🔒</span>
      </button>


      <button
        class="plot locked"
        data-plot="17"
      >
        <span class="lock">🔒</span>
      </button>


      <button
        class="plot locked"
        data-plot="18"
      >
        <span class="lock">🔒</span>
      </button>


      <button
        class="plot locked"
        data-plot="19"
      >
        <span class="lock">🔒</span>
      </button>


      <button
        class="plot locked"
        data-plot="20"
      >
        <span class="lock">🔒</span>
      </button>

    </section>


    <!-- =====================
         BẢNG CHỌN HẠT
    ====================== -->

    <div
      class="seed-panel"
      id="seedPanel"
      aria-hidden="true"
    >

      <div class="seed-box">

        <button
          class="seed-close"
          id="seedClose"
          type="button"
        >
          ×
        </button>


        <h2>
          🌱 Chọn hạt giống
        </h2>


        <p
          class="selected-plot"
          id="selectedPlot"
        >
          Chọn ô đất
        </p>


        <!-- 10 HẠT -->

        <div class="seed-list">


          <button
            class="seed-item"
            type="button"
            data-seed="wheat"
          >

            <span class="seed-icon">
              🌾
            </span>

            <strong>
              Lúa mì
            </strong>

            <span class="seed-price">
              🪙 10
            </span>

            <span class="seed-level">
              Lv.1
            </span>

          </button>


          <button
            class="seed-item"
            type="button"
            data-seed="corn"
          >

            <span class="seed-icon">
              🌽
            </span>

            <strong>
              Ngô
            </strong>

            <span class="seed-price">
              🪙 20
            </span>

            <span class="seed-level">
              Lv.3
            </span>

          </button>


          <button
            class="seed-item"
            type="button"
            data-seed="radish"
          >

            <span class="seed-icon">
              🌱
            </span>

            <strong>
              Củ cải
            </strong>

            <span class="seed-price">
              🪙 35
            </span>

            <span class="seed-level">
              Lv.7
            </span>

          </button>


          <button
            class="seed-item"
            type="button"
            data-seed="carrot"
          >

            <span class="seed-icon">
              🥕
            </span>

            <strong>
              Cà rốt
            </strong>

            <span class="seed-price">
              🪙 50
            </span>

            <span class="seed-level">
              Lv.10
            </span>

          </button>


          <button
            class="seed-item"
            type="button"
            data-seed="beet"
          >

            <span class="seed-icon">
              🫜
            </span>

            <strong>
              Củ dền
            </strong>

            <span class="seed-price">
              🪙 75
            </span>

            <span class="seed-level">
              Lv.13
            </span>

          </button>


          <button
            class="seed-item"
            type="button"
            data-seed="eggplant"
          >

            <span class="seed-icon">
              🍆
            </span>

            <strong>
              Cà tím
            </strong>

            <span class="seed-price">
              🪙 100
            </span>

            <span class="seed-level">
              Lv.15
            </span>

          </button>


          <button
            class="seed-item"
            type="button"
            data-seed="chili"
          >

            <span class="seed-icon">
              🌶️
            </span>

            <strong>
              Ớt
            </strong>

            <span class="seed-price">
              🪙 180
            </span>

            <span class="seed-level">
              Lv.17
            </span>

          </button>


          <button
            class="seed-item"
            type="button"
            data-seed="green_onion"
          >

            <span class="seed-icon">
              🌿
            </span>

            <strong>
              Hành lá
            </strong>

            <span class="seed-price">
              🪙 250
            </span>

            <span class="seed-level">
              Lv.20
            </span>

          </button>


          <button
            class="seed-item"
            type="button"
            data-seed="cabbage"
          >

            <span class="seed-icon">
              🥬
            </span>

            <strong>
              Bắp cải
            </strong>

            <span class="seed-price">
              🪙 500
            </span>

            <span class="seed-level">
              Lv.23
            </span>

          </button>


          <button
            class="seed-item"
            type="button"
            data-seed="pumpkin"
          >

            <span class="seed-icon">
              🎃
            </span>

            <strong>
              Bí đỏ
            </strong>

            <span class="seed-price">
              🪙 1000
            </span>

            <span class="seed-level">
              Lv.25
            </span>

          </button>


        </div>

      </div>

    </div>


  </main>


  <script src="/script.js"></script>

</body>

</html>
